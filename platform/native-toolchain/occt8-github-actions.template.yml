# INTEGRATION ONLY: install at .github/workflows/occt8-native.yml.
# Its controlled dispatch checks out BOTH unmerged source PRs, not main.
# CI is manual because the expensive OCCT build must not restart on rapid PR pushes.
name: Pinned OCCT 8.0.1 C++ execution qualification
on:
  workflow_dispatch:
    inputs:
      platform_ref:
        description: "Platform source ref; supply immutable PR #159 candidate SHA"
        type: string
        required: true
        default: refs/pull/159/head
      kernel_ref:
        description: "Kernel source ref; use admitted KERNEL-001 exact SHA"
        type: string
        required: true
        default: c46d02847468b69a106fbfa6fad715c10399ff2c
      runtime_ref:
        description: "Immutable accepted RUNTIME consumer source SHA; do not pass floating main"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: intuit3d-occt8-native
  cancel-in-progress: false

jobs:
  native:
    name: Ubuntu / real pinned OCCT C++ and STEP
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - name: Checkout scoped Platform candidate (exact source preferred)
        uses: actions/checkout@v4
        with:
          repository: techrote/INTUIT3D
          ref: ${{ inputs.platform_ref }}
          path: platform-repo
          persist-credentials: false
      - name: Checkout KERNEL admitted source (immutable SHA)
        uses: actions/checkout@v4
        with:
          repository: techrote/INTUIT3D
          ref: ${{ inputs.kernel_ref }}
          path: kernel-repo
          persist-credentials: false
      - name: Checkout immutable RUNTIME product consumer
        uses: actions/checkout@v4
        with:
          repository: techrote/INTUIT3D
          ref: ${{ inputs.runtime_ref }}
          path: runtime-repo
          persist-credentials: false
      - name: Install Node 22 for real native product consumer
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install accepted RUNTIME workspace dependencies
        working-directory: runtime-repo
        run: npm ci
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake ninja-build g++ python3 patchelf binutils
      - name: Run source and qualification contract regressions (not geometry acceptance)
        run: |
          python3 -m unittest discover -s platform-repo/platform/native-toolchain \
            -p 'test_*.py' -v
      - name: Record host/compiler/kernel provenance
        run: |
          mkdir -p "$RUNNER_TEMP/intuit3d-native-evidence"
          {
            echo "platform_ref_requested=${{ inputs.platform_ref }}"
            echo "kernel_ref_requested=${{ inputs.kernel_ref }}"
            echo "platform=$(git -C platform-repo rev-parse HEAD)"
            echo "kernel=$(git -C kernel-repo rev-parse HEAD)"
            echo "host=$(uname -a)"
            g++ --version | head -n 1
            cmake --version | head -n 1
            ninja --version
            python3 --version
          } > "$RUNNER_TEMP/intuit3d-native-evidence/versions.txt"
      - name: Fetch and verify official immutable OCCT 8.0.1 source
        run: |
          mkdir -p "$RUNNER_TEMP/intuit3d-native-work"
          python3 platform-repo/platform/native-toolchain/fetch_pinned_occt.py \
            --destination "$RUNNER_TEMP/intuit3d-native-work/occt-source" \
            --evidence "$RUNNER_TEMP/intuit3d-native-evidence/source-fetch" --timeout 1200
      - name: Compile genuine OCCT C++ worker and execute 8/12 mm Boolean + STEP
        run: |
          python3 platform-repo/platform/native-toolchain/qualify.py \
            --kernel-tree "$GITHUB_WORKSPACE/kernel-repo" \
            --source "$RUNNER_TEMP/intuit3d-native-work/occt-source" \
            --prefix "$RUNNER_TEMP/intuit3d-native-work/occt-prefix" \
            --output "$RUNNER_TEMP/intuit3d-native-evidence/qualification" \
            --jobs 2 --timeout 5400 --native-timeout 60
      - name: Verify genuine C++ result and exercise KERNEL native bridge tests
        run: |
          python3 - "$RUNNER_TEMP/intuit3d-native-evidence/qualification/qualification.json" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding='utf-8') as f: report=json.load(f)
          assert report.get('status')=='NATIVE_EXPERIMENTAL_PASS', report
          assert report.get('nativeCppExecuted') is True, report
          assert {case['thicknessMm'] for case in report['artifacts']}=={8,12}, report
          PY
          export INTUIT3D_OCCT8_WORKER="$RUNNER_TEMP/intuit3d-native-evidence/qualification/worker-build/intuit3d_occt8_plate"
          test -x "$INTUIT3D_OCCT8_WORKER"
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/kernel-repo/native/tests" \
            -p test_occt8_bridge.py -v 2>&1 | tee "$RUNNER_TEMP/intuit3d-native-evidence/native-tests.log"
          sha256sum "$INTUIT3D_OCCT8_WORKER" \
            "$RUNNER_TEMP/intuit3d-native-evidence/qualification/plate-8mm.step" \
            "$RUNNER_TEMP/intuit3d-native-evidence/qualification/plate-12mm.step" \
            > "$RUNNER_TEMP/intuit3d-native-evidence/native-files.sha256"
      # INTEGRATION-owned workflow install is required before this can execute.
      # Fail the hosted job if the *actual extracted published archive* cannot
      # run both pinned C++ plates, a geometric edit and its restoration.
      - name: Publish source-matched offline C++ bundle and replay edited STEP after extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 platform-repo/platform/native-toolchain/bundle_offline.py \
            --qualification "$RUNNER_TEMP/intuit3d-native-evidence/qualification" \
            --prefix "$RUNNER_TEMP/intuit3d-native-work/occt-prefix" \
            --kernel-tree "$GITHUB_WORKSPACE/kernel-repo" \
            --output "$RUNNER_TEMP/intuit3d-native-work/offline-occt801" \
            | tee "$RUNNER_TEMP/intuit3d-native-evidence/offline-bundle-execution.json"
          test -s "$RUNNER_TEMP/intuit3d-native-work/offline-occt801.tar.gz"
          cp "$RUNNER_TEMP/intuit3d-native-work/offline-occt801.tar.gz" \
             "$RUNNER_TEMP/intuit3d-native-evidence/offline-occt801.tar.gz"
          sha256sum "$RUNNER_TEMP/intuit3d-native-evidence/offline-occt801.tar.gz" \
            > "$RUNNER_TEMP/intuit3d-native-evidence/offline-archive.sha256"
      # Platform source is a template: INTEGRATION owns actual .github adoption.
      # Verify both the native bundle and seven real local RUNTIME C++/STEP
      # stages before a host can publish a working installed product consumer.
      - name: Execute source-matched real RUNTIME local-bridge demo from installed OCCT8 archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/intuit3d-native-work/offline-occt801.tar.gz"
          python3 platform-repo/platform/native-toolchain/qualify_runtime_delivery.py \
            --archive "$ARCHIVE" \
            --archive-sha256 "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" \
            --kernel-sha "$(git -C kernel-repo rev-parse HEAD)" \
            --platform-sha "$(git -C platform-repo rev-parse HEAD)" \
            --runtime-tree "$GITHUB_WORKSPACE/runtime-repo" \
            --runtime-sha "$(git -C runtime-repo rev-parse HEAD)" \
            --destination "$RUNNER_TEMP/intuit3d-native-work/occt801-runtime-installed" \
            2>&1 | tee "$RUNNER_TEMP/intuit3d-native-evidence/runtime-delivery.log"
      - name: Remove only huge intermediate build directory before artifact upload
        if: always()
        run: |
          BUILD="$RUNNER_TEMP/intuit3d-native-evidence/qualification/occt-build"
          if test -f "$BUILD/CMakeFiles/CMakeConfigureLog.yaml"; then
            cp "$BUILD/CMakeFiles/CMakeConfigureLog.yaml" "$RUNNER_TEMP/intuit3d-native-evidence/occt-configure.yaml"
          fi
          rm -rf -- "$BUILD"
      - name: Preserve native build, genuine worker and STEP evidence on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occt801-cxx-and-step-evidence
          path: ${{ runner.temp }}/intuit3d-native-evidence/
          if-no-files-found: warn
          retention-days: 14
