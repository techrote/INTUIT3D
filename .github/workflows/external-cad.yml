# INTEGRATION acceptance: real non-OCCT geometry, not a Part 21 text scan or OCCT self-readback.
# Verify original OCP flange samples and original pinned-C++ 8/12 mm STEP bytes separately.
name: Independent non-OCCT STEP geometry qualification
on:
  pull_request:
    paths:
      - '.github/workflows/external-cad.yml'
      # Real conformance source changes must execute the independent CAD
      # importer; ordinary Node CI is insufficient for physical STEP claims.
      - 'conformance/external-cad/**'
  workflow_dispatch:
    inputs:
      cad_ref:
        description: "External CAD source ref; PR checks out its own immutable head"
        type: string
        required: true
        default: main

      native_artifact_id:
        description: "Original successful pinned OCCT8 C++ Actions artifact ID"
        type: string
        required: true
        default: '13581127658'
      kernel_sha:
        description: "Full immutable KERNEL producer commit recorded in the native artifact"
        type: string
        required: true
        default: c46d02847468b69a106fbfa6fad715c10399ff2c

permissions:
  contents: read
  actions: read

concurrency:
  group: intuit3d-external-step-qualification
  cancel-in-progress: false

jobs:
  external:
    name: Ubuntu / pinned non-OCCT CAD import and geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout external CAD candidate
        uses: actions/checkout@v4
        with:
          repository: techrote/INTUIT3D
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'intuit/integration/source-matched-platform-witness-20261108' && 'a46814c874d31b0644ea0279002390ff59afa124') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'intuit/integration/195-cross-engine-original-20261108' && 'e155633b3fe3ce07295953432f16305c3eb191db') || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || inputs.cad_ref || github.sha }}
          path: cad-source
          persist-credentials: false
      - name: Download original actual OCP STEP evidence (not generated mock files)
        uses: actions/download-artifact@v4
        with:
          name: model-native-experimental-ocp-step
          run-id: 42345301755
          repository: techrote/INTUIT3D
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-artifact
      - name: Prepare immutable input and pin checkout SHA
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intuit3d-external-evidence"
          mkdir -p "$root/original"
          git -C cad-source rev-parse HEAD > "$root/checked-out-cad-source.txt"
          echo "Original GitHub Actions run: 42345301755" >> "$root/checked-out-cad-source.txt"
          echo "Original Actions artifact: 13563062028" >> "$root/checked-out-cad-source.txt"
          required=(flange.four.step flange.thick.step flange.five.step flange.undo.step)
          for file in "${required[@]}"; do
            mapfile -t found < <(find original-artifact -type f -name "$file")
            if [ "${#found[@]}" -ne 1 ]; then
              echo "::error::original artifact must contain exactly one $file, found ${#found[@]}"
              exit 1
            fi
            cp -- "${found[0]}" "$root/original/$file"
          done
          (cd "$root/original" && zip -q "$root/original-flange.zip" "${required[@]}")
          sha256sum "$root/original/"*.step > "$root/step-inputs.sha256"
          sha256sum "$root/original-flange.zip" >> "$root/step-inputs.sha256"
      - name: Run external-CAD harness regression (not geometry admission)
        run: |
          python3 -m unittest discover -s cad-source/conformance/external-cad -p 'test_*.py' -v
          bash -n cad-source/conformance/external-cad/run-pinned-brlcad.sh
      - name: Execute real pinned BRL-CAD 7.44.0 STEP import, volume and ray probes
        working-directory: cad-source
        shell: bash
        run: |
          set -euo pipefail
          bash conformance/external-cad/run-pinned-brlcad.sh \
            --bundle "$RUNNER_TEMP/intuit3d-external-evidence/original-flange.zip" \
            --evidence-dir "$RUNNER_TEMP/intuit3d-external-evidence/brlcad" \
            2>&1 | tee "$RUNNER_TEMP/intuit3d-external-evidence/execution.log"
      # Reuse the genuinely executed pinned C++ evidence instead of recompiling
      # OCCT or substituting the older experimental OCP flange STEP output.
      - name: Download original source-matched pinned C++ evidence ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_ARTIFACT_ID: ${{ inputs.native_artifact_id || '13581127658' }}
          KERNEL_EXPECTED_SHA: ${{ inputs.kernel_sha || 'c46d02847468b69a106fbfa6fad715c10399ff2c' }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid native artifact ID' >&2; exit 2; }
          [[ "$KERNEL_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid immutable KERNEL SHA' >&2; exit 2; }
          root="$RUNNER_TEMP/intuit3d-external-evidence"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output "$root/original-native-cxx.zip" \
            "https://api.github.com/repos/techrote/INTUIT3D/actions/artifacts/$NATIVE_ARTIFACT_ID/zip"
          sha256sum "$root/original-native-cxx.zip" > "$root/original-native-zip.sha256"
          printf 'native_artifact_id=%s\nrequested_kernel_sha=%s\n' \
            "$NATIVE_ARTIFACT_ID" "$KERNEL_EXPECTED_SHA" > "$root/native-producer-inputs.txt"

      - name: Reuse source-pinned independent AnvilCAD executable
        shell: bash
        working-directory: cad-source
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intuit3d-external-evidence"
          probe="$root/brlcad/anvilcad-independent/anvilcad/target/release/examples/intuit_step_probe"
          if [[ ! -x "$probe" ]]; then
            # BRL-CAD might learn to import these flanges in a future release;
            # the native-pair still requires a non-OCCT physical importer.
            bash conformance/external-cad/run-pinned-anvil.sh \
              --bundle "$root/original-flange.zip" \
              --evidence-dir "$root/native-pair-anvil"
            probe="$root/native-pair-anvil/anvilcad/target/release/examples/intuit_step_probe"
          fi
          test -x "$probe"
          printf '%s\n' "$probe" > "$root/independent-probe.path"
          sha256sum "$probe" > "$root/native-pair-probe.sha256"

      - name: Reconstruct original native 8/12mm STEP in independent non-OCCT CAD
        shell: bash
        working-directory: cad-source
        env:
          KERNEL_EXPECTED_SHA: ${{ inputs.kernel_sha || 'c46d02847468b69a106fbfa6fad715c10399ff2c' }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intuit3d-external-evidence"
          probe="$(cat "$root/independent-probe.path")"
          python3 conformance/external-cad/native_pair.py \
            --native-zip "$root/original-native-cxx.zip" \
            --kernel-sha "$KERNEL_EXPECTED_SHA" \
            --probe "$probe" \
            --output-dir "$root/native-pair" \
            2>&1 | tee "$root/native-pair-execution.log"
          python3 - "$root/native-pair/qualification.json" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding='utf-8') as f: data=json.load(f)
          assert data['status']=='NON_OCCT_SOURCE_MATCHED_NATIVE_PAIR_ACCEPTED', data
          assert data['kernelSha']==__import__('os').environ['KERNEL_EXPECTED_SHA'], data
          assert len(data['cases'])==2 and all(c['importedExactBRep'] for c in data['cases']),data
          PY
      # Independent physical verification of actual pinned C++ KERNEL-002
      # selected L-profile solids. Reuse the same already-built AnvilCAD binary
      # from the flange/plate checks; do NOT rebuild OCCT or vendor toolchains.
      # Source and bytes are immutable original Actions artifacts, never a
      # same-engine OCCT echo or text-only STEP validator.
      - name: Acquire original pinned-C++ L-profile STEP artifact with immutable hash
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intuit3d-external-evidence"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output "$root/original-native-l-profile.zip" \
            "https://api.github.com/repos/techrote/INTUIT3D/actions/artifacts/13589327619/zip"
          actual="$(sha256sum "$root/original-native-l-profile.zip" | cut -d' ' -f1)"
          expected="087559d17805cb6a900193e8d9ad6aa9c408570e763b78b117caa5074e2ba399"
          test "$actual" = "$expected" || {
            echo "::error::Original source-matched native L-profile ZIP hash mismatch"; exit 1;
          }
          printf 'artifact_id=13589327619\nzip_sha256=%s\nproducer_kernel=a017a50fa3f97d4ca9de079e5b7f1870c9602d85\n' \
            "$actual" > "$root/l-profile-artifact-source.txt"
      - name: Independently import all six L-profile STEP solids and verify 180 geometry rays
        shell: bash
        working-directory: cad-source
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intuit3d-external-evidence"
          probe="$(cat "$root/independent-probe.path")"
          test -x "$probe"
          probe_sha="$(sha256sum "$probe" | cut -d' ' -f1)"
          python3 conformance/external-cad/l_profile.py \
            --bundle "$root/original-native-l-profile.zip" \
            --artifact-sha256 087559d17805cb6a900193e8d9ad6aa9c408570e763b78b117caa5074e2ba399 \
            --kernel-sha a017a50fa3f97d4ca9de079e5b7f1870c9602d85 \
            --anvil-source-sha 50c053840933c92d598976e837e63ccd7626c312 \
            --probe "$probe" --probe-sha256 "$probe_sha" \
            --output-dir "$root/l-profile-physical" \
            2>&1 | tee "$root/l-profile-execution.log"
          python3 - "$root/l-profile-physical/qualification.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              result = json.load(f)
          assert result['status'] == 'NON_OCCT_SOURCE_MATCHED_L_PROFILE_ACCEPTED', result
          assert result['independentCadInteroperability'] is True
          assert result['kernelSourceCommit'] == 'a017a50fa3f97d4ca9de079e5b7f1870c9602d85'
          assert len(result['cases']) == 6, result
          assert all(c['importedExactBRep'] and len(c['rays']) == 30 for c in result['cases']), result
          assert sum(len(c['rays']) for c in result['cases']) == 180
          print('NON_OCCT_SOURCE_MATCHED_L_PROFILE_ACCEPTED six real STEP solids, 180 material/void rays')
          PY
      # This is a new permanent physical gate: four ORIGINAL pinned OCCT8 C++
      # STEP files, reconstructed by the independently compiled non-OCCT probe.
      # Existing OCP/L-profile checks do NOT substitute for this check.
      - name: Acquire immutable pinned-C++ ordered and mixed cut-chain artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intuit3d-external-evidence"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output "$root/original-native-cut-chains.zip" \
            "https://api.github.com/repos/techrote/INTUIT3D/actions/artifacts/13590844544/zip"
          expected="8fc4672185012fac4adae2dd0546435b78e94d31b8fee36014be724e536cbd65"
          actual="$(sha256sum "$root/original-native-cut-chains.zip" | cut -d' ' -f1)"
          test "$actual" = "$expected" || {
            echo '::error::Original pinned C++ cut-chain ZIP SHA-256 mismatch'; exit 1;
          }
          printf 'artifact_id=13590844544\narchive_sha256=%s\nproducer_kernel=ad60d1d5a05031c8ce63ee280fd1f34d9c51ecd9\n' \
            "$actual" > "$root/cut-chain-source.txt"
      - name: Independently import four original cut chains and verify 156 physical rays
        shell: bash
        working-directory: cad-source
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intuit3d-external-evidence"
          probe="$(cat "$root/independent-probe.path")"
          test -x "$probe"
          probe_sha="$(sha256sum "$probe" | cut -d' ' -f1)"
          python3 conformance/external-cad/cut_chains.py \
            --bundle "$root/original-native-cut-chains.zip" \
            --artifact-sha256 8fc4672185012fac4adae2dd0546435b78e94d31b8fee36014be724e536cbd65 \
            --kernel-sha ad60d1d5a05031c8ce63ee280fd1f34d9c51ecd9 \
            --anvil-source-sha 50c053840933c92d598976e837e63ccd7626c312 \
            --probe "$probe" --probe-sha256 "$probe_sha" \
            --output-dir "$root/cut-chains-physical" \
            2>&1 | tee "$root/cut-chains-execution.log"
          python3 - "$root/cut-chains-physical/qualification.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              r = json.load(f)
          assert r['status'] == 'NON_OCCT_SOURCE_MATCHED_CUT_CHAINS_ACCEPTED', r
          assert r['independentCadInteroperability'] is True, r
          assert r['kernelSourceCommit'] == 'ad60d1d5a05031c8ce63ee280fd1f34d9c51ecd9', r
          assert r['nativeArtifactSha256'] == '8fc4672185012fac4adae2dd0546435b78e94d31b8fee36014be724e536cbd65', r
          assert r['anvilSourceCommit'] == '50c053840933c92d598976e837e63ccd7626c312', r
          assert len(r['cases']) == 4, r
          assert all(c['importedExactBRep'] and c['rayCount'] == 39 and len(c['rays']) == 39 for c in r['cases']), r
          assert sum(c['rayCount'] for c in r['cases']) == 156, r
          print('NON_OCCT_SOURCE_MATCHED_CUT_CHAINS_ACCEPTED four pinned C++ STEP solids, 156 rays')
          PY
      # Independent physical U-bracket gate: preserve the original compiled
      # OCCT8 C++ producer and STEP bytes, reuse this job's actual non-OCCT
      # AnvilCAD executable and execute the newly admitted world-space probe.
      # This is NOT an OCCT self-readback or a static STEP text check.
      - name: Acquire original immutable pinned-C++ U-bracket STEP artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intuit3d-external-evidence"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output "$root/original-native-u-bracket.zip" \
            "https://api.github.com/repos/techrote/INTUIT3D/actions/artifacts/13593058907/zip"
          actual="$(sha256sum "$root/original-native-u-bracket.zip" | cut -d' ' -f1)"
          expected='9f6ee1b45a9db925eaa941876bb399835232fa7c0f3667f905165386b3046ba9'
          test "$actual" = "$expected" || {
            echo '::error::Original pinned C++ U-bracket artifact SHA-256 mismatch'; exit 1;
          }
          printf 'artifact_id=13593058907\narchive_sha256=%s\nproducer_kernel=7e893a6deb4ca7d88c7bd92ec42fb828cfc87a5c\n' \
            "$actual" > "$root/u-bracket-artifact-source.txt"
      - name: Independently reconstruct two original U-bracket STEP solids and 80 physical rays
        shell: bash
        working-directory: cad-source
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intuit3d-external-evidence"
          probe="$(cat "$root/independent-probe.path")"
          test -x "$probe"
          probe_sha="$(sha256sum "$probe" | cut -d' ' -f1)"
          python3 conformance/external-cad/u_bracket.py \
            --bundle "$root/original-native-u-bracket.zip" \
            --artifact-sha256 9f6ee1b45a9db925eaa941876bb399835232fa7c0f3667f905165386b3046ba9 \
            --kernel-sha 7e893a6deb4ca7d88c7bd92ec42fb828cfc87a5c \
            --anvil-source-sha 50c053840933c92d598976e837e63ccd7626c312 \
            --probe "$probe" --probe-sha256 "$probe_sha" \
            --output-dir "$root/u-bracket-physical" \
            2>&1 | tee "$root/u-bracket-execution.log"
          python3 - "$root/u-bracket-physical/qualification.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              r = json.load(f)
          assert r['status'] == 'NON_OCCT_SOURCE_MATCHED_U_BRACKET_ACCEPTED', r
          assert r['independentCadInteroperability'] is True, r
          assert r['nativeArtifactSha256'] == '9f6ee1b45a9db925eaa941876bb399835232fa7c0f3667f905165386b3046ba9', r
          assert r['kernelSourceCommit'] == '7e893a6deb4ca7d88c7bd92ec42fb828cfc87a5c', r
          assert r['anvilSourceCommit'] == '50c053840933c92d598976e837e63ccd7626c312', r
          assert len(r['cases']) == 2, r
          assert [case['label'] for case in r['cases']] == ['u-8', 'u-12'], r
          assert all(case['importedExactBRep'] and case['rayCount'] == 40
                     and len(case['rays']) == 40 for case in r['cases']), r
          assert sum(case['rayCount'] for case in r['cases']) == 80, r
          assert r['cases'][0]['nativeStepSha256'] != r['cases'][1]['nativeStepSha256'], r
          print('NON_OCCT_SOURCE_MATCHED_U_BRACKET_ACCEPTED two original STEP solids, 80 real material/void/floor rays')
          PY
      # Reuse original OCCT8 worker and sixteen STEP files from the exact
      # KERNEL #195 physical run, without recompiling expensive OCCT.
      # This Integration PR pins the independently authored STEP #221 candidate
      # and its AnvilCAD Rust importer; real geometry readback is compulsory.
      - name: Checkout exact source-matched KERNEL generalized v5/v6 producer
        uses: actions/checkout@v4
        with:
          repository: techrote/INTUIT3D
          ref: 93e984963db720cacdd8bb679a559a3b8df88ce8
          path: kernel-source
          persist-credentials: false
      - name: Acquire original immutable selected sloped v5/v6 C++ STEP artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intuit3d-external-evidence"
          # Do not accept newly generated or synthetic STEP files.
          test "$(git -C kernel-source rev-parse HEAD)" = '93e984963db720cacdd8bb679a559a3b8df88ce8'
          # The dedicated Integration candidate has a strict immutable source
          # fence. Later STEP PRs must instead test their own actual head,
          # rather than being permanently blocked by the historical SHA.
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' &&
                "$GITHUB_HEAD_REF" == 'intuit/integration/195-cross-engine-original-20261108' ]]; then
            test "$(git -C cad-source rev-parse HEAD)" = 'e155633b3fe3ce07295953432f16305c3eb191db' || {
              echo "::error::Selected sloped candidate code changed; requalify exact candidate SHA"; exit 1;
            }
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -o "$root/original-selected-v5-v6.zip" \
            https://api.github.com/repos/techrote/INTUIT3D/actions/artifacts/13608757244/zip
          actual="$(sha256sum "$root/original-selected-v5-v6.zip" | cut -d' ' -f1)"
          expected="1f29b9988b2c360c8c030ec65a5e3ffa72b9bfae8ed2c87e9258cfc253437558"
          test "$actual" = "$expected" || {
            echo "::error::Original OCCT worker/STEP upload ZIP digest mismatch"; exit 1;
          }
          mkdir -p "$root/new-native"
          unzip -q "$root/original-selected-v5-v6.zip" -d "$root/new-native"
          worker="$root/new-native/qualification/worker-build/intuit3d_occt8_plate"
          test -f "$worker"
          actual_worker="$(sha256sum "$worker" | cut -d' ' -f1)"
          test "$actual_worker" = 'd888308e6ac867d6d3fb59accc3a552ce74f13a23e78d2bd003a7b5a10f2c795' || {
            echo "::error::Compiled pinned OCCT worker bytes/source changed"; exit 1;
          }
          chmod +x "$worker"
          test -f "$root/new-native/selected-sloped-v5-v6/original-step-sha256.json"
          printf 'producer_run=42456419544\nproducer_artifact=13608757244\nzip_sha256=%s\nkernel_source=93e984963db720cacdd8bb679a559a3b8df88ce8\nstep_candidate=e155633b3fe3ce07295953432f16305c3eb191db\nworker_sha256=%s\n' \
            "$actual" "$actual_worker" > "$root/new-native-custody.txt"
      - name: Independently import 16 original v5/v6 STEP and reject wrong shapes
        shell: bash
        working-directory: cad-source
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intuit3d-external-evidence"
          source_root="$root/new-native/selected-sloped-v5-v6"
          worker="$root/new-native/qualification/worker-build/intuit3d_occt8_plate"
          probe="$(cat "$root/independent-probe.path")"
          test -x "$probe"
          probe_sha="$(sha256sum "$probe" | cut -d' ' -f1)"
          anvil_sha='50c053840933c92d598976e837e63ccd7626c312'
          python3 conformance/external-cad/sloped_v5.py \
            --direct-dir "$source_root/direct-v5" \
            --authored-dir "$source_root/authored-v5" \
            --kernel-tree ../kernel-source --kernel-sha 93e984963db720cacdd8bb679a559a3b8df88ce8 \
            --worker "$worker" --probe "$probe" \
            --probe-sha256 "$probe_sha" --anvil-source-sha "$anvil_sha" \
            --output-dir "$root/selected-v5-independent" \
            2>&1 | tee "$root/selected-v5-execution.log"
          python3 conformance/external-cad/progressive_v6.py \
            --direct-dir "$source_root/direct-v6" \
            --authored-dir "$source_root/authored-v6" \
            --kernel-tree ../kernel-source --kernel-sha 93e984963db720cacdd8bb679a559a3b8df88ce8 \
            --worker "$worker" --probe "$probe" \
            --probe-sha256 "$probe_sha" --anvil-source-sha "$anvil_sha" \
            --output-dir "$root/progressive-v6-independent" \
            2>&1 | tee "$root/progressive-v6-execution.log"
          python3 - "$root" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          v5=json.loads((root/'selected-v5-independent/qualification.json').read_text())
          v6=json.loads((root/'progressive-v6-independent/qualification.json').read_text())
          assert v5['status']=='NON_OCCT_SLOPED_V5_FOUR_STEP_PHYSICAL_PASS',v5
          assert v6['status']=='NON_OCCT_PROGRESSIVE_V6_PHYSICAL_GATE_PASS',v6
          assert v5['independentCadInteroperability'] is True
          assert v6['independentCadInteroperability'] is True
          assert len(v5['cases'])==4 and sum(c['rayCount'] for c in v5['cases'])==248
          assert len(v6['cases'])==12 and sum(c['rayCount'] for c in v6['cases'])==744
          assert len(v6['physicalNegatives'])==4 and all(x['rejected'] for x in v6['physicalNegatives'])
          print('NON_OCCT_SOURCE_MATCHED_SELECTED_V5_V6_16_STEP_PHYSICAL_PASS: 992 rays, 4 adversaries')
          PY
      # #252's new generic world-space witness must run as a real source-bound
      # executable, not merely pass the historical 16-solid importer. Reuse the
      # already-compiled independent Rust probe and ORIGINAL C++ STEP bytes.
      - name: Execute Git-custodied non-OCCT generic 3D witness and wrong-solid rejection
        shell: bash
        working-directory: cad-source
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/intuit3d-external-evidence"
          direct="$root/new-native/selected-sloped-v5-v6/direct-v6"
          worker="$root/new-native/qualification/worker-build/intuit3d_occt8_plate"
          probe="$(cat "$root/independent-probe.path")"
          witness=conformance/external-cad/witness-v6-direct-two-cuts-8mm.txt
          test -x "$probe"
          test -s "$direct/progressive-v6-receipts.json"
          test -s "$direct/progressive-2-8.step"
          test -s "$direct/progressive-0-8.step"
          python3 conformance/external-cad/witness_3d.py \
            --kernel-tree ../kernel-source --kernel-sha 93e984963db720cacdd8bb679a559a3b8df88ce8 \
            --worker "$worker" --worker-sha256 d888308e6ac867d6d3fb59accc3a552ce74f13a23e78d2bd003a7b5a10f2c795 \
            --probe "$probe" --probe-sha256 "$(sha256sum "$probe" | cut -d' ' -f1)" \
            --anvil-source-sha 50c053840933c92d598976e837e63ccd7626c312 \
            --receipt "$direct/progressive-v6-receipts.json" \
            --receipt-sha256 abeec276e695fde86a1c2ce309ec2d8908ed8b942e76efbf8d3fa1905b8abeae \
            --positive "$direct/progressive-2-8.step" --positive-index 4 \
            --positive-sha256 17537f2c896e6ed5347d123df6982fbbcd17e703e33b52a5b9eadff4aa993c16 \
            --negative "$direct/progressive-0-8.step" --negative-index 0 \
            --negative-sha256 d8779d25b18ee234adc3167222257a31d773914817bc02e48a0907112ebdf439 \
            --witness "$witness" \
            --witness-sha256 "$(sha256sum "$witness" | cut -d' ' -f1)" \
            --output-dir "$root/generic-3d-witness" \
            2>&1 | tee "$root/generic-3d-witness.log"
          python3 - "$root/generic-3d-witness/qualification.json" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1],encoding='utf-8'))
          assert report['status']=='NON_OCCT_3D_MATERIAL_WITNESS_PHYSICAL_PASS',report
          assert report['independentCadInteroperability'] is True,report
          assert len(report['physicalCases'])==2,report
          positive,negative=report['physicalCases']
          assert positive['role']=='positive' and positive['rayCount']==14,positive
          assert negative['role']=='negative' and negative['rejection'].startswith(
              'NOT_QUALIFIED: WITNESS_GEOMETRY:'),negative
          print('NON_OCCT_3D_MATERIAL_WITNESS_PHYSICAL_PASS 14 genuine 3D rays, original STEP wrong-solid rejected')
          PY
      - name: Exclude distributor binary and extraction tree from evidence upload
        if: always()
        shell: bash
        run: |
          root="$RUNNER_TEMP/intuit3d-external-evidence/brlcad/toolchain"
          if test -d "$root"; then
            rm -rf -- "$root/unpacked" "$root/brlcad_7.44.0-0_amd64.deb"
          fi
      - name: Preserve real original STEP and independent CAD evidence, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brlcad-7440-independent-step-evidence
          path: ${{ runner.temp }}/intuit3d-external-evidence/
          if-no-files-found: warn
          retention-days: 14
