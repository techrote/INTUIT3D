# INTEGRATION acceptance: execute genuine unmerged KERNEL/PLATFORM candidates on hosted Linux.
# KERNEL-001 source-matched hosted qualification. The accepted-main push gate
# builds precisely github.sha; workflow_dispatch permits explicit candidate
# qualification. Optional KERNEL-002 operators remain a separate gate.
name: Pinned OCCT 8.0.1 C++ execution qualification
on:
  # A bounded, source-pinned physical KERNEL-002 candidate is checked from
  # this existing workflow whenever INTEGRATION changes its acceptance gate.
  # Do not trust ordinary Node/experimental OCP checks as OCCT8 evidence.
  pull_request:
    paths:
      - '.github/workflows/occt8-native.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'packages/kernel-contract/**'
  workflow_dispatch:
    inputs:
      platform_ref:
        description: "Platform ref; pinned accepted build source unless explicitly supplied"
        type: string
        required: true
        default: b015036b565cae422f285a9bacfbb04b771f6918
      runtime_ref:
        description: "Immutable RUNTIME+Workbench consumer source; use exact admitted main SHA"
        type: string
        required: true
        default: 324be5870efe4887c2656c992a71aa99f19375a3
      kernel_ref:
        description: "Kernel source ref, immutable KERNEL-001 extraction #158 by default"
        type: string
        required: true
        default: c46d02847468b69a106fbfa6fad715c10399ff2c

permissions:
  contents: read

concurrency:
  group: intuit3d-occt8-native
  cancel-in-progress: false

jobs:
  native:
    name: Ubuntu / real pinned OCCT C++ and STEP
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      PYTHONDONTWRITEBYTECODE: '1' # prevent runtime-derived .pyc/__pycache__ from entering immutable archive
    steps:
      - name: Checkout pinned accepted Platform source
        uses: actions/checkout@v4
        with:
          repository: techrote/INTUIT3D
          ref: ${{ (github.event_name == 'pull_request' && 'b015036b565cae422f285a9bacfbb04b771f6918') || (github.event_name == 'push' && github.sha) || inputs.platform_ref || 'b015036b565cae422f285a9bacfbb04b771f6918' }}
          path: platform-repo
          persist-credentials: false
      - name: Checkout KERNEL-001 #158 immutable source (or explicit KERNEL-002 ref)
        uses: actions/checkout@v4
        with:
          repository: techrote/INTUIT3D
          ref: ${{ (github.event_name == 'push' && github.sha) || (github.event_name == 'pull_request' && '7e893a6deb4ca7d88c7bd92ec42fb828cfc87a5c') || inputs.kernel_ref || 'c46d02847468b69a106fbfa6fad715c10399ff2c' }}
          path: kernel-repo
          persist-credentials: false
      # The runtime checkout is immutable and intentionally separate from the
      # C++ producer: its real seven-stage consumer must not use the PR merge ref.
      - name: Checkout source-matched accepted RUNTIME consumer
        uses: actions/checkout@v4
        with:
          repository: techrote/INTUIT3D
          ref: ${{ (github.event_name == 'push' && github.sha) || (github.event_name == 'pull_request' && '324be5870efe4887c2656c992a71aa99f19375a3') || inputs.runtime_ref || '324be5870efe4887c2656c992a71aa99f19375a3' }}
          path: runtime-repo
          persist-credentials: false
      - name: Install native packaging, ELF audit and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake ninja-build g++ python3 patchelf binutils
      - name: Run source and qualification contract regressions (not geometry acceptance)
        run: |
          python3 -m unittest discover -s platform-repo/platform/native-toolchain \
            -p 'test_*.py' -v
      - name: Record host/compiler/kernel provenance
        run: |
          mkdir -p "$RUNNER_TEMP/intuit3d-native-evidence"
          {
            echo "platform_ref_requested=${{ inputs.platform_ref }}"
            echo "kernel_ref_requested=${{ inputs.kernel_ref }}"
            echo "platform=$(git -C platform-repo rev-parse HEAD)"
            echo "kernel=$(git -C kernel-repo rev-parse HEAD)"
            echo "runtime=$(git -C runtime-repo rev-parse HEAD)"
            echo "host=$(uname -a)"
            g++ --version | head -n 1
            cmake --version | head -n 1
            ninja --version
            python3 --version
          } > "$RUNNER_TEMP/intuit3d-native-evidence/versions.txt"
      - name: Fetch and verify official immutable OCCT 8.0.1 source
        run: |
          mkdir -p "$RUNNER_TEMP/intuit3d-native-work"
          python3 platform-repo/platform/native-toolchain/fetch_pinned_occt.py \
            --destination "$RUNNER_TEMP/intuit3d-native-work/occt-source" \
            --evidence "$RUNNER_TEMP/intuit3d-native-evidence/source-fetch" --timeout 1200
      - name: Compile genuine OCCT C++ worker and execute 8/12 mm Boolean + STEP
        run: |
          python3 platform-repo/platform/native-toolchain/qualify.py \
            --kernel-tree "$GITHUB_WORKSPACE/kernel-repo" \
            --source "$RUNNER_TEMP/intuit3d-native-work/occt-source" \
            --prefix "$RUNNER_TEMP/intuit3d-native-work/occt-prefix" \
            --output "$RUNNER_TEMP/intuit3d-native-evidence/qualification" \
            --jobs 2 --timeout 5400 --native-timeout 60
      - name: Verify genuine C++ result and exercise KERNEL native bridge tests
        run: |
          python3 - "$RUNNER_TEMP/intuit3d-native-evidence/qualification/qualification.json" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding='utf-8') as f: report=json.load(f)
          assert report.get('status')=='NATIVE_EXPERIMENTAL_PASS', report
          assert report.get('nativeCppExecuted') is True, report
          assert {case['thicknessMm'] for case in report['artifacts']}=={8,12}, report
          PY
          export INTUIT3D_OCCT8_WORKER="$RUNNER_TEMP/intuit3d-native-evidence/qualification/worker-build/intuit3d_occt8_plate"
          test -x "$INTUIT3D_OCCT8_WORKER"
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/kernel-repo/native/tests" \
            -p test_occt8_bridge.py -v 2>&1 | tee "$RUNNER_TEMP/intuit3d-native-evidence/native-tests.log"
          sha256sum "$INTUIT3D_OCCT8_WORKER" \
            "$RUNNER_TEMP/intuit3d-native-evidence/qualification/plate-8mm.step" \
            "$RUNNER_TEMP/intuit3d-native-evidence/qualification/plate-12mm.step" \
            > "$RUNNER_TEMP/intuit3d-native-evidence/native-files.sha256"
      - name: Check optional KERNEL-002 cuts availability, without weakening KERNEL-001 gate
        id: advanced
        shell: bash
        run: |
          if test -f kernel-repo/packages/kernel-contract/examples/pinned-occt8-cuts.mjs && \
             test -f kernel-repo/packages/kernel-contract/examples/pinned-occt8-mixed-cuts.mjs; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'KERNEL-002 operators present: running physical ordered/mixed cut gates'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'KERNEL-001 extraction does not include KERNEL-002; its separate gates are out of this admission'
          fi
      # Newest KERNEL #67 adds ordered rectangular and mixed circular/rectangular
      # cuts. Exercise the ACTUAL compiled OCCT8 executable; source-only checks
      # cannot qualify new Boolean/STEP behaviour.
      - name: Install pinned Node 22 for real native cut-provider consumers
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute compiled C++ ordered and mixed cut chains with changed STEP bytes
        if: steps.advanced.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export INTUIT3D_OCCT8_WORKER="$RUNNER_TEMP/intuit3d-native-evidence/qualification/worker-build/intuit3d_occt8_plate"
          test -x "$INTUIT3D_OCCT8_WORKER"
          output="$RUNNER_TEMP/intuit3d-native-evidence/cut-chain-fixtures"
          mkdir -p "$output/ordered" "$output/mixed"
          node kernel-repo/packages/kernel-contract/examples/pinned-occt8-cuts.mjs \
            "$INTUIT3D_OCCT8_WORKER" "$output/ordered" \
            2>&1 | tee "$output/ordered-execution.log"
          node kernel-repo/packages/kernel-contract/examples/pinned-occt8-mixed-cuts.mjs \
            "$INTUIT3D_OCCT8_WORKER" "$output/mixed" \
            2>&1 | tee "$output/mixed-execution.log"
          test -s "$output/ordered/plate-cuts-8.step"
          test -s "$output/ordered/plate-cuts-12.step"
          test -s "$output/mixed/mixed-8.step"
          test -s "$output/mixed/mixed-12.step"
          test -s "$output/ordered/manifest.json"
          test -s "$output/mixed/manifest.json"
          sha256sum "$output/ordered/"*.step "$output/mixed/"*.step > "$output/native-cut-step.sha256"
          printf 'kernel=%s\nworker_sha256=%s\n' \
            "$(git -C kernel-repo rev-parse HEAD)" \
            "$(sha256sum "$INTUIT3D_OCCT8_WORKER" | cut -d' ' -f1)" \
            > "$output/source-and-worker.txt"
      # Real RUNTIME + INTENT + SKETCH L-profile source and C++ output gates.
      # A source-matched OCCT 8.0.1 binary is REQUIRED, not simulated or OCP.
      # On the workflow-change PR this run is pinned to immutable KERNEL-002
      # source 7e893a6deb4ca7d88c7bd92ec42fb828cfc87a5c; accepted-main KERNEL-001 push keeps its own SHA.
      - name: Check authored L-profile physical fixture availability
        id: lprofile
        shell: bash
        run: |
          set -euo pipefail
          examples=kernel-repo/packages/kernel-contract/examples
          if test -f "$examples/runtime-occt8-l-profile-native.mjs" && \
             test -f "$examples/runtime-occt8-l-profile-width-edit-native.mjs" && \
             test -f "$examples/runtime-occt8-l-profile-pocket-edit-native.mjs"; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo '::error::Pinned KERNEL-002 candidate lacks required L profile demonstrations'
            exit 1
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Original KERNEL-001 plate baseline: generalized L-v3 not present'
          fi

      - name: Execute compiled OCCT8 C++ L-bracket thickness, width and blind-pocket edits with six STEP outputs
        if: steps.lprofile.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          worker="$RUNNER_TEMP/intuit3d-native-evidence/qualification/worker-build/intuit3d_occt8_plate"
          test -x "$worker"
          candidate="$(git -C kernel-repo rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test "$candidate" = "7e893a6deb4ca7d88c7bd92ec42fb828cfc87a5c" || {
              echo "::error::KERNEL-002 source moved: $candidate"; exit 1;
            }
          fi
          npm ci --prefix kernel-repo
          output="$RUNNER_TEMP/intuit3d-native-evidence/l-profile-consumer"
          mkdir -p "$output/thickness" "$output/width" "$output/pocket"
          node kernel-repo/packages/kernel-contract/examples/runtime-occt8-l-profile-native.mjs \
            "$worker" "$output/thickness" 2>&1 | tee "$output/thickness/native-execution.log"
          node kernel-repo/packages/kernel-contract/examples/runtime-occt8-l-profile-width-edit-native.mjs \
            "$worker" "$output/width" 2>&1 | tee "$output/width/native-execution.log"
          node kernel-repo/packages/kernel-contract/examples/runtime-occt8-l-profile-pocket-edit-native.mjs \
            "$worker" "$output/pocket" 2>&1 | tee "$output/pocket/native-execution.log"
          for path in \
            "$output/thickness/initial-8.step" "$output/thickness/edited-12.step" \
            "$output/width/l-width-120.step" "$output/width/l-width-140.step" \
            "$output/pocket/pocket-3.step" "$output/pocket/pocket-5.step"; do
            test -s "$path" || { echo "::error::Missing real native STEP: $path"; exit 1; }
          done
          for scenario in thickness width pocket; do
            test -s "$output/$scenario/manifest.json"
            test -s "$output/$scenario/authoritative-document.json"
          done
          sha256sum "$output/"{thickness,width,pocket}/*.step > "$output/six-step-files.sha256"
          sha256sum "$worker" > "$output/worker.sha256"
          printf 'kernel_sha=%s\nworkflow_sha=%s\n' \
            "$candidate" "$GITHUB_SHA" > "$output/source-provenance.txt"

      # New KERNEL-002 v4 source: one selected 8-edge orthogonal U-profile,
      # blind circular pocket + through rectangular window, real 8→12 mm edit.
      # Required physical execution on this workflow-change candidate; not
      # satisfied by Node/schema/OCP or an earlier KERNEL branch's C++ run.
      - name: Require selected U-profile v4 fixture on KERNEL-002 PR qualification
        id: uprofile
        shell: bash
        run: |
          set -euo pipefail
          example="kernel-repo/packages/kernel-contract/examples/pinned-occt8-orthogonal-profile.mjs"
          fixture="kernel-repo/native/examples/occt8-u-bracket-orthogonal.request.json"
          if test -f "$example" && test -f "$fixture"; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo '::error::Pinned KERNEL-002 v4 candidate lacks selected U-profile fixture'; exit 1
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Execute compiled pinned OCCT8 C++ U-bracket Boolean and two distinct STEP outputs
        if: steps.uprofile.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          worker="$RUNNER_TEMP/intuit3d-native-evidence/qualification/worker-build/intuit3d_occt8_plate"
          test -x "$worker"
          kernel="$(git -C kernel-repo rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            test "$kernel" = '7e893a6deb4ca7d88c7bd92ec42fb828cfc87a5c' || {
              echo "::error::Unreviewed KERNEL candidate source: $kernel"; exit 1;
            }
          fi
          export INTUIT3D_OCCT8_WORKER="$worker"
          python3 -m unittest discover -s kernel-repo/native/tests \
            -p test_occt8_orthogonal_contract.py -v \
            2>&1 | tee "$RUNNER_TEMP/intuit3d-native-evidence/u-bracket-native-tests.log"
          output="$RUNNER_TEMP/intuit3d-native-evidence/u-bracket-physical"
          mkdir -p "$output"
          node kernel-repo/packages/kernel-contract/examples/pinned-occt8-orthogonal-profile.mjs \
            "$worker" "$output" 2>&1 | tee "$output/native-execution.log"
          test -s "$output/u-8.step"
          test -s "$output/u-12.step"
          test -s "$output/manifest.json"
          python3 - "$output/manifest.json" <<'PY'
          import json, math, sys
          with open(sys.argv[1], encoding='utf-8') as f: r=json.load(f)
          assert r['result']=='PINNED_OCCT8_CPP_SELECTED_ORTHOGONAL_TWO_STEP_EXECUTED',r
          assert r['version']=='OCCT-8.0.1-C++',r
          a,b=r['observations']
          assert [a['thicknessMm'],b['thicknessMm']]==[8,12],r
          assert a['stepSha256']!=b['stepSha256'] and a['profileId']==b['profileId'],r
          assert a['cuts']==b['cuts'],r
          assert all(not x['exactAuthority'] and not x['independentInteroperability'] for x in (a,b)),r
          for x,expected in ((a,6100*8-75*math.pi-960),(b,6100*12-75*math.pi-1440)):
              assert abs(x['measuredVolumeMm3']-expected)<1e-5,(x,expected)
              assert abs(x['sameEngineVolumeMm3']-expected)<1e-5,(x,expected)
          print('PINNED_CXX_U_BRACKET_PASS actual 8/12 physical solid, volume, two STEP SHA receipts')
          PY
          sha256sum "$worker" "$output/u-8.step" "$output/u-12.step" \
            > "$output/worker-and-step-files.sha256"
          printf 'kernel_sha=%s\nworkflow_sha=%s\n' "$kernel" "$GITHUB_SHA" \
            > "$output/source-provenance.txt"
      # The PLATFORM candidate can now deliver an actual relocated C++ worker,
      # but older KERNEL-001 accepted-main pushes may still lack these new scripts.
      # On this workflow PR both source components are mandatory: no silent skip.
      - name: Require source-matched offline bundle and real RUNTIME consumer
        id: delivery
        shell: bash
        run: |
          set -euo pipefail
          if test -f platform-repo/platform/native-toolchain/bundle_offline.py && \
             test -f platform-repo/platform/native-toolchain/qualify_runtime_delivery.py && \
             test -f runtime-repo/packages/workflow-runtime/test/local-occt8-bridge.native-demo.mjs; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo '::error::Exact-source PLATFORM offline/C++ RUNTIME acceptance tooling absent'
            exit 1
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Legacy accepted-main native plate gate: offline runtime delivery not available'
          fi
      - name: Install source-matched RUNTIME Node 22 dependencies
        if: steps.delivery.outputs.available == 'true'
        working-directory: runtime-repo
        run: npm ci
      - name: Package genuine OCCT 8.0.1 C++ worker and replay extracted four-case STEP
        if: steps.delivery.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/intuit3d-native-work/offline-occt801"
          evidence="$RUNNER_TEMP/intuit3d-native-evidence"
          python3 platform-repo/platform/native-toolchain/bundle_offline.py \
            --qualification "$evidence/qualification" \
            --prefix "$RUNNER_TEMP/intuit3d-native-work/occt-prefix" \
            --kernel-tree "$GITHUB_WORKSPACE/kernel-repo" \
            --output "$output" \
            --replay-evidence "$evidence/offline-extracted-fresh-steps" \
            | tee "$evidence/offline-bundle-execution.json"
          test -s "$output.tar.gz"
          cp "$output.tar.gz" "$evidence/offline-occt801.tar.gz"
          sha256sum "$evidence/offline-occt801.tar.gz" > "$evidence/offline-archive.sha256"
          python3 - "$evidence/offline-bundle-execution.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f: receipt=json.load(f)
          assert receipt['status']=='OFFLINE_BUNDLE_PASS',receipt
          assert receipt['extractedArchiveCppReplay']['status']=='OFFLINE_CXX_REPLAY_PASS',receipt
          assert set(receipt['extractedArchiveCppReplay']['cases'])=={'8','12','edited8','restored8'},receipt
          print('OFFLINE_BUNDLE_PASS / EXTRACTED_CXX_FOUR_STEP_PASS')
          PY
      - name: Install relocated archive and execute seven real INTENT/SKETCH/RUNTIME native STEP stages
        if: steps.delivery.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/intuit3d-native-evidence"
          archive="$RUNNER_TEMP/intuit3d-native-work/offline-occt801.tar.gz"
          python3 platform-repo/platform/native-toolchain/qualify_runtime_delivery.py \
            --archive "$archive" \
            --archive-sha256 "$(sha256sum "$archive" | cut -d' ' -f1)" \
            --kernel-sha "$(git -C kernel-repo rev-parse HEAD)" \
            --platform-sha "$(git -C platform-repo rev-parse HEAD)" \
            --runtime-tree "$GITHUB_WORKSPACE/runtime-repo" \
            --runtime-sha "$(git -C runtime-repo rev-parse HEAD)" \
            --destination "$RUNNER_TEMP/intuit3d-native-work/occt801-runtime-installed" \
            2> "$evidence/runtime-delivery.stderr.log" \
            | tee "$evidence/runtime-delivery.json"
          python3 - "$evidence/runtime-delivery.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f: receipt=json.load(f)
          assert receipt['status']=='RUNTIME_PINNED_OCCT8_DELIVERY_PASS',receipt
          assert receipt['nativeStepCount']==7,receipt
          assert receipt['archiveAndRuntimeSourceMatched'] is True,receipt
          assert set(receipt['nativeArchiveReplayCases'])=={'8','12','edited8','restored8'},receipt
          assert receipt['independentCadInteroperability'] is False,receipt
          assert receipt['windowsNativeQualified'] is False,receipt
          print('RUNTIME_PINNED_OCCT8_DELIVERY_PASS / SEVEN_NATIVE_STEPS')
          PY
      - name: Remove only huge intermediate build directory before artifact upload
        if: always()
        run: |
          BUILD="$RUNNER_TEMP/intuit3d-native-evidence/qualification/occt-build"
          if test -f "$BUILD/CMakeFiles/CMakeConfigureLog.yaml"; then
            cp "$BUILD/CMakeFiles/CMakeConfigureLog.yaml" "$RUNNER_TEMP/intuit3d-native-evidence/occt-configure.yaml"
          fi
          rm -rf -- "$BUILD"
      - name: Preserve native build, genuine worker and STEP evidence on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occt801-cxx-and-step-evidence
          path: ${{ runner.temp }}/intuit3d-native-evidence/
          if-no-files-found: warn
          retention-days: 14
