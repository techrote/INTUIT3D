name: Workbench integration lockfile qualification

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'tooling/tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/workbench-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intuit3d-web-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    name: Generate exact-source lockfile candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lock without executing install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate combined workspace inventory
        run: |
          node -e "const fs=require('fs'); const l=JSON.parse(fs.readFileSync('package-lock.json')); for(const p of ['apps/web','packages/model','packages/sketch']) if(!l.packages[p]) throw Error('missing '+p); for(const p of ['node_modules/react','node_modules/three','node_modules/vite']) if(!l.packages[p]) throw Error('missing '+p)"
          sha256sum package-lock.json
      - name: Publish reproducible lockfile transcript chunks for source custody
        run: |
          node -e "const fs=require('fs');const b=fs.readFileSync('package-lock.json').toString('base64');console.log('LOCKFILE_TRANSCRIPT_BEGIN');for(let i=0;i<b.length;i+=1600)console.log('LOCKFILE_CHUNK_'+(i/1600)+':'+b.slice(i,i+1600));console.log('LOCKFILE_TRANSCRIPT_END')"
      - uses: actions/upload-artifact@v4
        with:
          name: exact-source-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
  check:
    needs: lockfile
    name: Generated-lock qualification / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: exact-source-package-lock
          path: .
      - name: Install from generated lock only
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Execute root and all workspace tests/type checks/builds
        run: npm run ci
      - name: Check explicit web production build
        run: npm run build --workspace @intuit3d/web
      - name: Verify workspace package versions
        run: npm ls --workspaces --depth=0
      - name: Actual Chromium rendering + numeric edit/recovery
        if: matrix.os == 'ubuntu-latest'
        run: node tooling/browser-smoke.mjs
      - name: Actual Chromium sketch-handle drag, keyboard, undo/redo and reload
        if: matrix.os == 'ubuntu-latest'
        # npm --workspace runs in apps/web/. Without this, the app harness
        # writes into apps/web/apps/web/ and screenshot upload silently misses it.
        env:
          INTUIT3D_HANDLE_ARTIFACTS: browser-evidence-handles
        run: npm run test:browser:handles --workspace @intuit3d/web
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          name: real-sketch-handle-capture
          path: apps/web/browser-evidence-handles/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          name: real-browser-capture
          path: browser-evidence/
          if-no-files-found: error
          retention-days: 14
