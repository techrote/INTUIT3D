name: Integration contracts and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intuit3d-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace / ${{ matrix.os }} / Node 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install workspace with locked dependencies
        run: npm ci
      - name: Run root integration oracle and existing workspace checks
        run: npm run ci
      # Accepted-main browser truth: run real Chrome against the composition
      # of ALL merged lanes, not just on each isolated WORKBENCH PR.
      - name: Real accepted-main Chromium sketch, E extrude/cut, edit and archive
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        env:
          INTUIT3D_HANDLE_ARTIFACTS: browser-evidence-handles
        run: |
          node tooling/browser-smoke.mjs
          npm run test:browser:handles --workspace @intuit3d/web
      - name: Preserve accepted-main Chromium click/keyboard screenshots
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && always()
        uses: actions/upload-artifact@v4
        with:
          name: accepted-main-chromium-workbench
          path: |
            apps/web/browser-evidence-handles/
            browser-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Real semantic history to experimental OCP/STEP (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: bash tooling/ci-model-native-plate.sh
      - name: Preserve real OCP STEP and semantic archive evidence (Linux only)
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: model-native-experimental-ocp-step
          path: ${{ runner.temp }}/intuit3d-model-native-evidence/
          if-no-files-found: warn
          retention-days: 14
